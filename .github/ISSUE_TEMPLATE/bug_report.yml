name: Bug report
description: Something in SHiFT doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest route, view or island that shows it. A fork of `apps/minimal` is ideal.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "@shift-stack/core, svelte, htmx.org, effect, Node, and the browser."
    validations:
      required: true
